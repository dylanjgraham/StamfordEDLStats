<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Stamford EDL</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ag-grid/31.3.2/ag-grid-community.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a08;
      --surface: #111110;
      --surface2: #191917;
      --border: #2a2a26;
      --accent: #e8c84a;
      --accent-dim: rgba(232,200,74,0.15);
      --red: #e84a4a;
      --green: #4ae87a;
      --text: #f0ede0;
      --muted: #6b6858;
      --muted2: #4a4840;
    }

    /* Light mode overrides */
    :root[data-theme="light"] {
      --bg: #f4f3ef;
      --surface: #ffffff;
      --surface2: #edecea;
      --border: #d4d0c8;
      --accent: #b8960a;
      --accent-dim: rgba(184,150,10,0.12);
      --red: #c0392b;
      --green: #1e8449;
      --text: #1a1a16;
      --muted: #7a7568;
      --muted2: #a8a298;
    }

    /* Theme toggle button */
    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 32px; height: 32px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 40px rgba(232,200,74,0.06);
    }

    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 0.08em;
      color: var(--accent);
      white-space: nowrap;
      text-shadow: 0 0 20px rgba(232,200,74,0.3);
    }

    .topbar-logo span { color: var(--text); }
    .topbar-divider { width: 1px; height: 32px; background: var(--border); }

    .season-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
    }

    #loadStatus {
      margin-left: auto;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .layout {
      display: flex;
      height: calc(100vh - 64px);
    }

    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 0;
    }

    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); }

    .sidebar-section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted2);
      padding: 16px 20px 8px;
    }

    .sidebar-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      background: none;
      border: none;
      padding: 9px 20px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
      border-left: 2px solid transparent;
    }

    .sidebar-btn:hover { background: var(--surface2); }
    .sidebar-btn.active { background: var(--accent-dim); border-left-color: var(--accent); }

    .sidebar-btn-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; }

    .sidebar-btn-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .sidebar-btn.active .sidebar-btn-text { color: var(--accent); }

    .sidebar-btn-sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      display: block;
    }

    .sidebar-btn.active .sidebar-btn-sub { color: rgba(232,200,74,0.6); }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .main-header {
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .main-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.05em;
      color: var(--text);
      line-height: 1;
    }

    .main-subtitle {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    .header-controls { display: flex; align-items: center; gap: 10px; }

    .search-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      padding: 7px 14px;
      outline: none;
      width: 220px;
      transition: border-color 0.2s;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    .row-count {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .row-count strong { color: var(--accent); }

    .grid-wrapper { flex: 1; overflow: hidden; }
    #myGrid { width: 100%; height: 100%; }

    /* Loading / error overlay */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 50;
      gap: 16px;
      font-family: 'Barlow Condensed', sans-serif;
    }

    .overlay-icon { font-size: 48px; }
    .overlay-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--accent); letter-spacing: 0.08em; }
    .overlay-sub { font-size: 14px; color: var(--muted); letter-spacing: 0.05em; }
    .overlay-error { color: var(--red); font-size: 13px; max-width: 400px; text-align: center; }

    .retry-btn {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 20px;
      cursor: pointer;
      margin-top: 8px;
    }

    .retry-btn:hover { background: rgba(232,200,74,0.25); }

    /* AG Grid theme */
    .ag-theme-darts {
      --ag-background-color: var(--bg);
      --ag-foreground-color: var(--text);
      --ag-border-color: var(--border);
      --ag-header-background-color: #0f0f0d;
      --ag-header-foreground-color: var(--accent);
      --ag-odd-row-background-color: var(--surface);
      --ag-row-hover-color: var(--surface2);
      --ag-selected-row-background-color: var(--accent-dim);
      --ag-font-family: 'Barlow Condensed', sans-serif;
      --ag-font-size: 13px;
      --ag-cell-horizontal-padding: 14px;
      --ag-row-height: 40px;
      --ag-header-height: 42px;
      --ag-range-selection-border-color: var(--accent);
    }

    /* Light mode AG Grid overrides */
    :root[data-theme="light"] .ag-theme-darts {
      --ag-background-color: #f4f3ef;
      --ag-header-background-color: #e8e6e0;
      --ag-odd-row-background-color: #ffffff;
      --ag-row-hover-color: #edecea;
    }

    .ag-theme-darts .ag-header-cell-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .ag-theme-darts .ag-cell { line-height: 40px; }

    /* Cell renderers */
    .bar-cell { display: flex; align-items: center; gap: 8px; height: 40px; }
    .bar-wrap { flex: 1; background: var(--border); height: 3px; }
    .bar-fill { height: 3px; border-radius: 2px; }
    @media (max-width: 768px) { .bar-wrap { display: none; } }
    .ppd-cell { color: var(--accent); font-weight: 600; }
    .mpr-cell { color: #7ad4e8; font-weight: 600; }
    .improvement-cell { color: var(--green); font-weight: 600; }
    .div-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 2px 7px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(232,200,74,0.2);
    }
    .rank-cell { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--muted); }
    .rank-cell.top { color: var(--accent); }

    /* Most-improved row */
    .ag-theme-darts .ag-row.row-most-improved {
      background-color: rgba(74, 232, 122, 0.07) !important;
      border-left: 3px solid var(--green) !important;
    }
    .ag-theme-darts .ag-row.row-most-improved:hover {
      background-color: rgba(74, 232, 122, 0.13) !important;
    }

    /* Improvement tooltip */
    .improvement-tooltip {
      position: fixed; pointer-events: none;
      background: #1a2e1f; border: 1px solid var(--green);
      color: var(--text); font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; padding: 8px 14px; z-index: 9999;
      display: none; white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .improvement-tooltip .tip-title { color: var(--green); font-weight: 700; font-size: 14px; letter-spacing: 0.05em; }
    .improvement-tooltip .tip-row { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .improvement-tooltip .tip-row span { color: var(--text); }

    /* Collapsible sidebar groups */
    .sidebar-group-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px 10px 16px; cursor: pointer; user-select: none;
      border-left: 2px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .sidebar-group-header:hover { background: var(--surface2); }
    .sidebar-group-header-label {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
    }
    .sidebar-group-header.open .sidebar-group-header-label { color: var(--text); }
    .sidebar-group-header.open { border-left-color: var(--muted2); }
    .sidebar-group-chevron {
      font-size: 9px; color: var(--muted2);
      transition: transform 0.2s; display: inline-block;
    }
    .sidebar-group-header.open .sidebar-group-chevron { transform: rotate(90deg); color: var(--muted); }
    .sidebar-group-items { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
    .sidebar-group-items.open { max-height: 600px; }

    /* Player chart modal */
    .chart-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 200; display: none; align-items: center; justify-content: center;
    }
    .chart-modal-backdrop.open { display: flex; }
    .chart-modal {
      background: var(--surface); border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      width: min(760px, 94vw); max-height: 86vh;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .chart-modal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 18px 24px 14px; border-bottom: 1px solid var(--border); gap: 16px;
    }
    .chart-modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.05em; color: var(--text); line-height: 1; }
    .chart-modal-subtitle { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; color: var(--muted); margin-top: 4px; }
    .chart-modal-close {
      background: none; border: 1px solid var(--border); color: var(--muted);
      font-size: 18px; width: 32px; height: 32px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, border-color 0.15s;
    }
    .chart-modal-close:hover { color: var(--text); border-color: var(--muted); }
    .chart-modal-body { padding: 24px; flex: 1; overflow: auto; min-height: 300px; }
    :root[data-theme="light"] .chart-modal { background: #ffffff; }
    :root[data-theme="light"] .admin-modal { background: #ffffff; }
    .chart-no-data {
      display: flex; align-items: center; justify-content: center;
      height: 200px; font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px; color: var(--muted); letter-spacing: 0.08em;
      flex-direction: column; gap: 8px;
    }
    .chart-no-data-icon { font-size: 36px; opacity: 0.4; }

    /* db status pill */
    .db-status {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
      letter-spacing: 0.1em; font-weight: 600; text-transform: uppercase;
      padding: 3px 10px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
    }
    .db-status.saved  { border-color: rgba(74,232,122,0.4); color: var(--green); }
    .db-status.saving { border-color: rgba(232,200,74,0.4); color: var(--accent); }
    .db-status.error  { border-color: rgba(232,74,74,0.4);  color: var(--red); }

    .ag-theme-darts .ag-row { cursor: pointer; }

    /* Trophy icon — highest out in division */
    .trophy-icon {
      font-size: 13px;
      cursor: default;
      position: relative;
      flex-shrink: 0;
    }
    .trophy-icon:hover::after {
      content: 'Highest Out this season';
      position: absolute;
      left: 50%;
      bottom: calc(100% + 6px);
      transform: translateX(-50%);
      background: #2a1f00;
      border: 1px solid rgba(232,200,74,0.5);
      color: var(--accent);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      padding: 4px 10px;
      pointer-events: none;
      z-index: 500;
    }

    /* Hide the default SVG sort icons that render as broken squares */
    .ag-theme-darts .ag-sort-indicator-icon .ag-icon { display: none; }
    .ag-theme-darts .ag-icon-asc::before  { content: none; }
    .ag-theme-darts .ag-icon-desc::before { content: none; }

    /* Replace with clean CSS pseudo-element arrows */
    .ag-theme-darts .ag-header-cell-sorted-asc  .ag-sort-indicator-icon::after,
    .ag-theme-darts .ag-header-cell-sorted-desc .ag-sort-indicator-icon::after {
      font-size: 10px;
      line-height: 1;
      margin-left: 4px;
      color: var(--accent);
    }
    .ag-theme-darts .ag-header-cell-sorted-asc  .ag-sort-indicator-icon::after { content: '▲'; }
    .ag-theme-darts .ag-header-cell-sorted-desc .ag-sort-indicator-icon::after { content: '▼'; }

    /* Unsorted columns — faint indicator on hover */
    .ag-theme-darts .ag-header-cell:not(.ag-header-cell-sorted-asc):not(.ag-header-cell-sorted-desc)
      .ag-sort-indicator-icon::after {
      content: '⇅';
      font-size: 10px;
      margin-left: 4px;
      color: var(--muted2);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .ag-theme-darts .ag-header-cell:hover .ag-sort-indicator-icon::after { opacity: 1; }

    /* Admin login + save modal */
    .admin-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.82);
      z-index: 300; display: none; align-items: center; justify-content: center;
    }
    .admin-modal-backdrop.open { display: flex; }
    .admin-modal {
      background: var(--surface); border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      width: min(420px, 94vw); padding: 28px 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    .admin-modal-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      letter-spacing: 0.05em; color: var(--accent); margin-bottom: 6px;
    }
    .admin-modal-desc {
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
      color: var(--muted); line-height: 1.5; margin-bottom: 20px;
    }
    .admin-field { margin-bottom: 14px; }
    .admin-label {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
      font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); display: block; margin-bottom: 6px;
    }
    .admin-input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; padding: 9px 14px; outline: none;
      transition: border-color 0.2s;
    }
    .admin-input:focus { border-color: var(--accent); }
    .admin-input::placeholder { color: var(--muted2); }
    .admin-note {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
      color: var(--muted2); margin-top: 5px; line-height: 1.4;
    }
    .admin-actions { display: flex; gap: 10px; margin-top: 20px; }
    .admin-btn-primary {
      background: var(--accent); border: none; color: #000;
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
      font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 9px 24px; cursor: pointer; flex: 1; transition: opacity 0.15s;
    }
    .admin-btn-primary:hover { opacity: 0.85; }
    .admin-btn-primary:disabled { opacity: 0.5; cursor: default; }
    .admin-btn-cancel {
      background: none; border: 1px solid var(--border); color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 9px 16px; cursor: pointer; transition: border-color 0.15s;
    }
    .admin-btn-cancel:hover { border-color: var(--muted); color: var(--text); }
    .admin-error {
      font-family: 'Barlow Condensed', sans-serif; font-size: 12px;
      color: var(--red); margin-top: 10px; min-height: 18px;
    }
    .admin-success {
      font-family: 'Barlow Condensed', sans-serif; font-size: 12px;
      color: var(--green); margin-top: 10px; min-height: 18px;
    }
    /* Admin button in topbar — hidden until ADMIN_HASH is set */
    .admin-topbar-btn {
      background: none; border: 1px solid var(--muted2); color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
      font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 4px 12px; cursor: pointer; white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .admin-topbar-btn:hover { color: var(--accent); border-color: var(--accent); }
    .admin-topbar-btn.authed { border-color: rgba(74,232,122,0.5); color: var(--green); }

    /* ── Mobile sidebar drawer ── */
    .sidebar-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 149;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .sidebar-backdrop.open { opacity: 1; }

    .hamburger {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px; height: 36px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s;
    }
    .hamburger:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Responsive breakpoints ── */
    @media (max-width: 768px) {

      /* Topbar */
      .topbar {
        padding: 0 14px;
        gap: 10px;
        height: 54px;
      }
      .topbar-logo { font-size: 20px; }
      .topbar-divider { display: none; }
      .season-badge { display: none; }
      #loadStatus { font-size: 0; gap: 0; margin-left: auto; } /* hide text, keep spinner */
      #loadStatus .spinner { display: block; }

      /* Show hamburger */
      .hamburger { display: flex; }

      /* Layout stacks: sidebar becomes an overlay drawer */
      .layout {
        height: calc(100dvh - 54px);
        position: relative;
      }

      .sidebar-backdrop { display: block; pointer-events: none; }
      .sidebar-backdrop.open { pointer-events: auto; }

      .sidebar {
        position: fixed;
        top: 54px;
        left: 0;
        height: calc(100dvh - 54px);
        width: 280px;
        min-width: unset;
        z-index: 150;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }

      .sidebar.open { transform: translateX(0); }

      /* Main fills full width */

<body>

<script>
// ============================================================
// AG GRID INIT
// ============================================================
let gridApi = null;
let SECTIONS = {};
let chartInstance = null;

const defaultColDef = {
  sortable: true,
  resizable: true,
  filter: 'agTextColumnFilter',
  filterParams: { buttons: ['reset'] },
};

gridApi = agGrid.createGrid(document.getElementById('myGrid'), {
  columnDefs: [],
  rowData: [],
  defaultColDef,
  animateRows: true,
  rowSelection: 'single',
  onFilterChanged: updateRowCount,
  getRowClass: params => params.data?.mostImproved ? 'row-most-improved' : '',
  onFirstDataRendered: autoSizeNameColumns,
  onRowDataUpdated: autoSizeNameColumns,
});

function autoSizeNameColumns() {
  // Auto-size player and team columns to fit content; leave numeric cols at fixed widths
  const colIds = gridApi.getColumns()
    ?.filter(c => ['player','team','against'].includes(c.getColId()))
    ?.map(c => c.getColId());
  if (colIds && colIds.length) gridApi.autoSizeColumns(colIds, false);
}

// ── Row click → open player chart ──────────────────────────────────────────
document.getElementById('myGrid').addEventListener('click', e => {
  const row = e.target.closest('.ag-row');
  if (!row) return;
  const rowIndex = row.getAttribute('row-index');
  if (rowIndex === null) return;
  let rowData = null;
  gridApi.forEachNode(node => { if (String(node.rowIndex) === String(rowIndex)) rowData = node.data; });
  if (!rowData || !rowData.player) return;
  const activeKey = document.querySelector('.sidebar-btn.active')?.dataset?.key ?? '';
  const statType = activeKey.endsWith('_cricket_stats') ? 'cricket' : 'x01';
  openPlayerChart(rowData, statType);
});

// ── Improvement tooltip ────────────────────────────────────────────────────
const tooltip = document.getElementById('improvementTooltip');
document.getElementById('myGrid').addEventListener('mousemove', e => {
  const row = e.target.closest('.ag-row');
  if (!row) { tooltip.style.display = 'none'; return; }
  const rowIndex = row.getAttribute('row-index');
  if (rowIndex === null) { tooltip.style.display = 'none'; return; }
  let rowData = null;
  gridApi.forEachNode(node => { if (String(node.rowIndex) === String(rowIndex)) rowData = node.data; });
  if (!rowData || !rowData.mostImproved) { tooltip.style.display = 'none'; return; }
  let html = '';
  if (rowData.improvement != null && rowData.prevPPD != null) {
    html = `<div class="tip-title">▲ Most Improved · X01</div>
      <div class="tip-row">Previous PPD: <span>${rowData.prevPPD.toFixed(2)}</span></div>
      <div class="tip-row">Current PPD:  <span>${rowData.ppd?.toFixed(2)}</span></div>
      <div class="tip-row">Improvement:  <span style="color:var(--green)">+${rowData.improvement.toFixed(2)}</span></div>`;
  } else if (rowData.improvement != null && rowData.prevMPR != null) {
    html = `<div class="tip-title">▲ Most Improved · Cricket</div>
      <div class="tip-row">Previous MPR: <span>${rowData.prevMPR.toFixed(2)}</span></div>
      <div class="tip-row">Current MPR:  <span>${rowData.mpr?.toFixed(2)}</span></div>
      <div class="tip-row">Improvement:  <span style="color:var(--green)">+${rowData.improvement.toFixed(2)}</span></div>`;
  }
  if (!html) { tooltip.style.display = 'none'; return; }
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  const tx = Math.min(e.clientX + 16, window.innerWidth - tooltip.offsetWidth - 8);
  const ty = Math.min(e.clientY + 16, window.innerHeight - tooltip.offsetHeight - 8);
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
});
document.getElementById('myGrid').addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// ── Chart modal ─────────────────────────────────────────────────────────────
document.getElementById('chartModalClose').addEventListener('click', closeChartModal);
document.getElementById('chartModal').addEventListener('click', e => {
  if (e.target === document.getElementById('chartModal')) closeChartModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeChartModal(); });

function closeChartModal() {
  document.getElementById('chartModal').classList.remove('open');
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
}

function makePlayerKey(player, team, div) {
  return [player, team, div].join('|').toLowerCase().replace(/[^a-z0-9|]/g, '_');
}

async function openPlayerChart(rowData, statType) {
  const { player, team = '', div = '' } = rowData;
  const playerKey = makePlayerKey(player, team, div);

  document.getElementById('chartModalTitle').textContent = player;
  document.getElementById('chartModalSubtitle').textContent =
    [team, div ? `Div ${div}` : ''].filter(Boolean).join(' · ') +
    ` · ${statType === 'cricket' ? 'Cricket (MPR)' : 'X01 (PPD)'}  — click a row to see their season progression`;
  document.getElementById('progressionChart').style.display = 'none';
  document.getElementById('chartNoData').style.display = 'flex';
  document.getElementById('chartModal').classList.add('open');
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  if (!historyData) {
    document.getElementById('chartNoData').querySelector('span:last-child').textContent = 'Loading history…';
    return;
  }

  try {
    const weeks = historyData.weeks || {};
    const points = Object.values(weeks)
      .sort((a, b) => a.week - b.week)
      .flatMap(w => {
        const entry = w.players?.[playerKey];
        if (!entry) return [];
        const val = statType === 'cricket' ? entry.mpr : entry.ppd;
        return val != null ? [{ week: w.week, val }] : [];
      });

    if (points.length < 1) {
      document.getElementById('chartNoData').style.display = 'flex';
      document.getElementById('progressionChart').style.display = 'none';
      return;
    }

    document.getElementById('chartNoData').style.display = 'none';
    document.getElementById('progressionChart').style.display = 'block';

    const label = statType === 'cricket' ? 'MPR' : 'PPD';
    const color = statType === 'cricket' ? '#7ad4e8' : '#e8c84a';
    const ctx = document.getElementById('progressionChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: points.map(p => `Wk ${p.week}`),
        datasets: [{
          label,
          data: points.map(p => p.val),
          borderColor: color,
          backgroundColor: color + '22',
          pointBackgroundColor: color,
          pointRadius: 5, pointHoverRadius: 7,
          tension: 0.3, fill: true,
        }],
      },
      options: {
        responsive: true,
        animation: { duration: 400 },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a1917', borderColor: color, borderWidth: 1,
            titleColor: color, bodyColor: '#f0ede0',
            titleFont: { family: 'Barlow Condensed', size: 13, weight: 'bold' },
            bodyFont:  { family: 'Barlow Condensed', size: 13 },
            callbacks: { label: ctx => ` ${label}: ${ctx.parsed.y.toFixed(2)}` },
          },
        },
        scales: {
          x: { ticks: { color: '#6b6858', font: { family: 'Barlow Condensed', size: 12 } }, grid: { color: '#2a2a26' } },
          y: { ticks: { color: '#6b6858', font: { family: 'Barlow Condensed', size: 12 }, callback: v => v.toFixed(2) }, grid: { color: '#2a2a26' } },
        },
      },
    });
  } catch (err) {
    console.error('Chart load error:', err);
    document.getElementById('chartNoData').style.display = 'flex';
  }
}

// ── History (GitHub JSON) ────────────────────────────────────────────────────
//
// SECURITY MODEL:
//   • Repo owner/name/branch are hardcoded — public info, fine in a public repo.
//   • ADMIN_HASH is a SHA-256 hash of your chosen password. The plaintext never
//     appears here. Safe to commit.
//   • The GitHub PAT is entered at admin login time and kept in memory only —
//     never written to localStorage, never committed, gone on page close.
//   • Visitors read history.json with no login via the public raw CDN.
//   • Only the admin (with the correct password + PAT) can write new data.
//
// HOW TO SET YOUR PASSWORD:
//   Open your browser console on any page and run:
//     crypto.subtle.digest('SHA-256', new TextEncoder().encode('yourpassword'))
//       .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
//   Copy the hex string and paste it as ADMIN_HASH below.

const REPO_OWNER  = 'dylanjgraham';
const REPO_REPO   = 'StamfordEDLStats';
const REPO_BRANCH = 'main';
const ADMIN_HASH  = 'e7988ea2dfceee762b7e6c5c2ef4a65acb893af4a42e5da23031627613c7db43';

// In-memory only — cleared on page close
let adminPat  = null;
let adminAuth = false;

let historyData = null;

// ── Public read (no auth) ─────────────────────────────────────────────────────
async function fetchHistory() {
  const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_REPO}/${REPO_BRANCH}/history.json?bust=${Date.now()}`;
  const res = await fetch(url);
  if (res.status === 404) return { lastWeek: 0, weeks: {} };
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function initDb() {
  try {
    historyData = await fetchHistory();
    console.log(`History loaded: ${Object.keys(historyData.weeks || {}).length} weeks`);
  } catch (e) {
    console.warn('Could not load history.json:', e);
    historyData = { lastWeek: 0, weeks: {} };
  }
  if (ADMIN_HASH) document.getElementById('adminBtn').style.display = '';
}

// ── GitHub write helpers ──────────────────────────────────────────────────────
function ghHeaders(pat) {
  return {
    'Authorization': `Bearer ${pat}`,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Content-Type': 'application/json',
  };
}

async function getFileSha(pat) {
  const res = await fetch(
    `https://api.github.com/repos/${REPO_OWNER}/${REPO_REPO}/contents/history.json`,
    { headers: ghHeaders(pat) }
  );
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub API ${res.status}`);
  return (await res.json()).sha;
}

async function commitHistory(pat, data, sha) {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const body = { message: `Update history.json — week ${data.lastWeek}`, content, branch: REPO_BRANCH };
  if (sha) body.sha = sha;
  const res = await fetch(
    `https://api.github.com/repos/${REPO_OWNER}/${REPO_REPO}/contents/history.json`,
    { method: 'PUT', headers: ghHeaders(pat), body: JSON.stringify(body) }
  );
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub API ${res.status}`);
  }
}

// ── Password hashing ──────────────────────────────────────────────────────────
async function sha256hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
}

// ── DB status pill ────────────────────────────────────────────────────────────
function setDbStatus(state, msg) {
  const el = document.getElementById('dbStatus');
  el.style.display = msg ? '' : 'none';
  el.className = 'db-status ' + state;
  el.textContent = msg;
}

// ── Admin modal ───────────────────────────────────────────────────────────────
// Best source for current week: max `weeks` value across all standings rows.
// Falls back to improvedWeek on any section (not present on week 1).
function getCurrentWeek() {
  // Primary: standings data — `weeks` column is the number of weeks played
  let maxWeeks = 0;
  for (const s of Object.values(SECTIONS)) {
    if (!s.data) continue;
    for (const row of s.data) {
      if (row.weeks != null && row.weeks > maxWeeks) maxWeeks = row.weeks;
    }
  }
  if (maxWeeks > 0) return maxWeeks;

  // Fallback: improvedWeek from most-improved sections (absent on week 1)
  for (const s of Object.values(SECTIONS)) {
    if (s.improvedWeek && s.improvedWeek !== '?') {
      const n = parseInt(s.improvedWeek, 10);
      if (!isNaN(n)) return n;
    }
  }

  return null;
}

function renderAdminModal(view) {
  const inner = document.getElementById('adminModalInner');

  if (view === 'login') {
    inner.innerHTML = `
      <div class="admin-modal-title">🔐 Admin Login</div>
      <div class="admin-modal-desc">Enter your admin password and a GitHub PAT to save this week's stats for week to week comparison.</div>
      <div class="admin-field">
        <label class="admin-label" for="adminPassword">Password</label>
        <input class="admin-input" id="adminPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="admin-field">
        <label class="admin-label" for="adminPatInput">GitHub Personal Access Token</label>
        <input class="admin-input" id="adminPatInput" type="password" placeholder="github_pat_…" autocomplete="off" />
        <div class="admin-note">Needs Contents: Read &amp; Write on this repo. Kept in memory only — never stored.</div>
      </div>
      <div class="admin-error" id="adminError"></div>
      <div class="admin-actions">
        <button class="admin-btn-primary" id="adminLoginBtn">Login</button>
        <button class="admin-btn-cancel" id="adminCancelBtn">Cancel</button>
      </div>`;

    const doLogin = async () => {
      const pw  = document.getElementById('adminPassword').value;
      const pat = document.getElementById('adminPatInput').value.trim();
      const err = document.getElementById('adminError');
      const btn = document.getElementById('adminLoginBtn');
      err.textContent = '';
      if (!pw || !pat) { err.textContent = 'Both fields are required.'; return; }
      btn.textContent = 'Verifying…'; btn.disabled = true;
      const hash = await sha256hex(pw);
      if (hash !== ADMIN_HASH) {
        err.textContent = 'Incorrect password.';
        btn.textContent = 'Login'; btn.disabled = false; return;
      }
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_REPO}`, { headers: ghHeaders(pat) });
        if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message || `HTTP ${res.status}`); }
      } catch(e) {
        err.textContent = `PAT error: ${e.message}`;
        btn.textContent = 'Login'; btn.disabled = false; return;
      }
      adminPat = pat;
      adminAuth = true;
      document.getElementById('adminBtn').classList.add('authed');
      document.getElementById('adminBtn').textContent = 'Admin ✓';
      renderAdminModal('save');
    };

    document.getElementById('adminLoginBtn').addEventListener('click', doLogin);
    document.getElementById('adminPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('adminPatInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('adminCancelBtn').addEventListener('click', closeAdminModal);

  } else if (view === 'save') {
    const weekNum = getCurrentWeek();
    const lastSaved = historyData?.lastWeek ?? 0;
    const isNew = weekNum && weekNum > lastSaved;

    inner.innerHTML = `
      <div class="admin-modal-title">💾 Save Week ${weekNum ?? '?'}</div>
      <div class="admin-modal-desc">
        ${isNew
          ? `New data detected. Last saved: <strong>Week ${lastSaved || 'never'}</strong>. Ready to commit Week ${weekNum} stats to <code>history.json</code>.`
          : `Week ${weekNum} is already saved (last saved: Week ${lastSaved}). You can force a re-save if needed.`}
      </div>
      <div class="admin-error" id="adminError"></div>
      <div class="admin-success" id="adminSuccess"></div>
      <div class="admin-actions">
        <button class="admin-btn-primary" id="adminSaveBtn">${isNew ? 'Save Now' : 'Force Re-save'}</button>
        <button class="admin-btn-cancel" id="adminCancelBtn">Close</button>
      </div>`;

    document.getElementById('adminCancelBtn').addEventListener('click', closeAdminModal);
    document.getElementById('adminSaveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('adminSaveBtn');
      const err = document.getElementById('adminError');
      const suc = document.getElementById('adminSuccess');
      err.textContent = ''; suc.textContent = '';
      btn.textContent = 'Saving…'; btn.disabled = true;
      try {
        await doSaveHistory(weekNum);
        suc.textContent = `✓ Week ${weekNum} committed to history.json`;
        btn.textContent = 'Saved ✓';
        setDbStatus('saved', `Wk ${weekNum} saved ✓`);
      } catch(e) {
        err.textContent = `Save failed: ${e.message}`;
        btn.textContent = 'Retry'; btn.disabled = false;
      }
    });
  }
}

async function doSaveHistory(weekNum) {
  const x01Data     = SECTIONS['all_x01_stats']?.data     ?? [];
  const cricketData = SECTIONS['all_cricket_stats']?.data ?? [];
  const players = {};
  for (const r of x01Data) {
    const key = makePlayerKey(r.player, r.team || '', r.div || '');
    if (!players[key]) players[key] = { player: r.player, team: r.team || '', div: r.div || '' };
    players[key].ppd = r.ppd;
  }
  for (const r of cricketData) {
    const key = makePlayerKey(r.player, r.team || '', r.div || '');
    if (!players[key]) players[key] = { player: r.player, team: r.team || '', div: r.div || '' };
    players[key].mpr = r.mpr;
  }
  if (!historyData) historyData = { lastWeek: 0, weeks: {} };
  historyData.weeks = historyData.weeks || {};
  historyData.weeks[String(weekNum)] = { week: weekNum, players, savedAt: Date.now() };
  historyData.lastWeek = Math.max(historyData.lastWeek || 0, weekNum);
  const sha = await getFileSha(adminPat);
  await commitHistory(adminPat, historyData, sha);
}

function openAdminModal() {
  document.getElementById('adminModal').classList.add('open');
  renderAdminModal(adminAuth ? 'save' : 'login');
}

function closeAdminModal() {
  document.getElementById('adminModal').classList.remove('open');
}

document.getElementById('adminBtn').addEventListener('click', openAdminModal);
document.getElementById('adminModal').addEventListener('click', e => {
  if (e.target === document.getElementById('adminModal')) closeAdminModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('adminModal').classList.contains('open')) closeAdminModal();
});

// ── Theme toggle ──────────────────────────────────────────────────────────────
(function() {
  const btn = document.getElementById('themeToggle');
  const root = document.documentElement;
  const LS_THEME = 'darts_theme';

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    btn.textContent = theme === 'light' ? '🌙' : '☀️';
    btn.title = theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode';
    try { localStorage.setItem(LS_THEME, theme); } catch {}
  }

  // Restore saved preference, defaulting to dark
  const saved = (() => { try { return localStorage.getItem(LS_THEME); } catch { return null; } })();
  applyTheme(saved === 'light' ? 'light' : 'dark');

  btn.addEventListener('click', () => {
    applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });
})();

// ── Mobile sidebar drawer ─────────────────────────────────────────────────────
(function() {
  const hamburger = document.getElementById('hamburger');
  const sidebar   = document.getElementById('sidebar');
  const backdrop  = document.getElementById('sidebarBackdrop');

  function openSidebar() {
    sidebar.classList.add('open');
    backdrop.classList.add('open');
    hamburger.textContent = '✕';
    hamburger.setAttribute('aria-label', 'Close menu');
    document.body.style.overflow = 'hidden';
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    backdrop.classList.remove('open');
    hamburger.textContent = '☰';
    hamburger.setAttribute('aria-label', 'Open menu');
    document.body.style.overflow = '';
  }

  function toggleSidebar() {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  }

  hamburger.addEventListener('click', toggleSidebar);
  backdrop.addEventListener('click', closeSidebar);

  // Close drawer when a section is selected on mobile
  const origLoad = window._origLoadSection || loadSection;
  window.addEventListener('sectionLoaded', closeSidebar);
})();

// ============================================================
// FETCH & PARSE
// ============================================================
async function loadData() {
  setOverlay('Fetching latest stats...');
  const URLS = [
    'https://api.amusementsunlimited.net/api/pages/get_page/?page_type=division_a_stats',
    'https://api.amusementsunlimited.net/api/pages/get_page/?page_type=division_bc_stats',
  ];
  let htmlBlocks = [];
  try {
    const responses = await Promise.all(URLS.map(u => fetch(u)));
    for (const res of responses) {
      if (!res.ok) throw new Error(`HTTP ${res.status} from ${res.url}`);
      const json = await res.json();
      const html = json[0].content || Object.values(json).find(v => typeof v === 'string' && v.includes('<table'));
      if (!html) throw new Error('Could not locate HTML in response from ' + res.url);
      htmlBlocks.push(html);
    }
  } catch (e) {
    showError('Failed to fetch data: ' + e.message);
    return;
  }
  try {
    SECTIONS = {};
    for (const html of htmlBlocks) {
      const partial = parseAllSections(html);
      Object.assign(SECTIONS, partial);
    }

    // Build combined cross-division sections from ALL merged per-division data.
    // Must happen after the loop so both A and BC divisions are included.
    const allX01Data     = Object.keys(SECTIONS)
      .filter(k => k.endsWith('_x01_stats'))
      .flatMap(k => SECTIONS[k].data ?? []);
    const allCricketData = Object.keys(SECTIONS)
      .filter(k => k.endsWith('_cricket_stats'))
      .flatMap(k => SECTIONS[k].data ?? []);
    SECTIONS['all_x01_stats']     = { label: 'All Divisions · X01',     icon: '🎯', sub: 'All divisions · PPD', division: null, columns: null, data: allX01Data };
    SECTIONS['all_cricket_stats'] = { label: 'All Divisions · Cricket', icon: '🏏', sub: 'All divisions · MPR', division: null, columns: null, data: allCricketData };

    buildSidebar();
    const firstKey =
      Object.keys(SECTIONS).find(k => k.match(/^a\d+_x01_stats/)) ??
      Object.keys(SECTIONS)[0];
    if (firstKey) loadSection(firstKey);
    hideOverlay();
    document.getElementById('loadStatus').textContent = '✓ Live data loaded';
    document.getElementById('loadStatus').style.color = 'var(--green)';
    await initDb(); // loads history.json publicly; shows admin btn if hash is set
  } catch (e) {
    showError('Failed to parse data: ' + e.message);
    console.error(e);
  }
}

// ============================================================
// HTML PARSER
// ============================================================
function parseAllSections(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const raw = { x01Improved: {}, cricketImproved: {}, x01Stats: {}, cricketStats: {}, standings: [] };
  const orderedSections = {};
  const allTables = Array.from(doc.querySelectorAll('table'));

  for (let i = 0; i < allTables.length; i++) {
    const table = allTables[i];
    const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim());
    const sectionName = getSectionName(table, doc);
    console.log(`Table ${i}: h3="${sectionName}" headers=[${headers.join(', ')}]`);

    if (headers.includes('Weeks') && headers.includes('Wins') && headers.includes('Losses')) {
      raw.standings = parseStandings(table);
    } else if (headers.includes('Against') && headers.includes('Forfeits')) {
      orderedSections['last_matches'] = { label: 'Last Match Results', icon: '📋', sub: 'Most recent results', columns: null, data: parseMatchResults(table) };
    } else if (headers.includes('PPD Improvement')) {
      const divMatch = sectionName.match(/Division\s+(\w+)/i);
      const div = divMatch ? divMatch[1] : 'Unknown';
      const weekMatch = sectionName.match(/week\s+(\d+)/i);
      const week = weekMatch ? weekMatch[1] : '?';
      raw.x01Improved[div] = { week, data: parseImprovedX01(table) };
    } else if (headers.includes('MPR Improvement')) {
      const divMatch = sectionName.match(/Division\s+(\w+)/i);
      const div = divMatch ? divMatch[1] : 'Unknown';
      const weekMatch = sectionName.match(/week\s+(\d+)/i);
      const week = weekMatch ? weekMatch[1] : '?';
      raw.cricketImproved[div] = { week, data: parseImprovedCricket(table) };
    } else if (headers.includes('PPD') && headers.includes('HiOut') && headers.includes('Ton80')) {
      const divMatch = sectionName.match(/Division\s+(\w+)/i);
      const div = divMatch ? divMatch[1] : 'Unknown';
      raw.x01Stats[div] = parseX01Stats(table);
    } else if (headers.includes('MPR') && headers.includes('9MR')) {
      const divMatch = sectionName.match(/Division\s+(\w+)/i);
      const div = divMatch ? divMatch[1] : 'Unknown';
      raw.cricketStats[div] = parseCricketStats(table);
    }
  }

  const allDivs = new Set([
    ...Object.keys(raw.x01Stats),
    ...Object.keys(raw.cricketStats),
    ...(raw.standings.map(r => r.division)),
  ]);
  const sortedDivs = [...allDivs].sort();
  const standingsByDiv = {};
  raw.standings.forEach(r => {
    if (!standingsByDiv[r.division]) standingsByDiv[r.division] = [];
    standingsByDiv[r.division].push(r);
  });
  const allX01Data = [];
  const allCricketData = [];

  sortedDivs.forEach(div => {
    if (standingsByDiv[div]) {
      orderedSections[`${div.toLowerCase()}_standings`] = {
        label: 'Standings', icon: '🏆', sub: `Division ${div}`,
        division: div, columns: null,
        data: standingsByDiv[div].map((r, i) => ({ ...r, rank: i + 1 })),
      };
    }
    if (raw.x01Stats[div]) {
      const improvedMap = {};
      if (raw.x01Improved[div]) raw.x01Improved[div].data.forEach(r => { improvedMap[r.player.toLowerCase()] = r; });
      const week = raw.x01Improved[div]?.week ?? '?';
      const mergedX01 = raw.x01Stats[div].map(r => {
        const imp = improvedMap[r.player.toLowerCase()];
        return imp ? { ...r, mostImproved: true, improvement: imp.improvement, prevPPD: imp.prevPPD } : { ...r, mostImproved: false };
      });
      orderedSections[`${div.toLowerCase()}_x01_stats`] = {
        label: 'Player Stats · X01', icon: '🎯', sub: `Div ${div} · PPD`,
        division: div, improvedWeek: week, columns: null, data: mergedX01,
      };
      allX01Data.push(...mergedX01);
    }
    if (raw.cricketStats[div]) {
      const improvedMap = {};
      if (raw.cricketImproved[div]) raw.cricketImproved[div].data.forEach(r => { improvedMap[r.player.toLowerCase()] = r; });
      const week = raw.cricketImproved[div]?.week ?? '?';
      const mergedCricket = raw.cricketStats[div].map(r => {
        const imp = improvedMap[r.player.toLowerCase()];
        return imp ? { ...r, mostImproved: true, improvement: imp.improvement, prevMPR: imp.prevMPR } : { ...r, mostImproved: false };
      });
      orderedSections[`${div.toLowerCase()}_cricket_stats`] = {
        label: 'Player Stats · Cricket', icon: '🏏', sub: `Div ${div} · MPR`,
        division: div, improvedWeek: week, columns: null, data: mergedCricket,
      };
      allCricketData.push(...mergedCricket);
    }
  });

  // Note: all_x01_stats and all_cricket_stats are NOT built here.
  // They are assembled in loadData after all API blocks are merged,
  // so they include every division rather than just one API response.
  return orderedSections;
}

// Get H3 text preceding a table.
// The table may be nested inside wrapper divs, so we walk up the ancestor
// chain and at each level scan all preceding siblings for an H3.
function getSectionName(table, doc) {
  let node = table;
  while (node) {
    // Scan preceding siblings of the current node
    let prev = node.previousElementSibling;
    while (prev) {
      if (prev.tagName === 'H3') return prev.textContent.trim();
      // Also check the last H3 *inside* a sibling (unlikely but safe)
      const inner = prev.querySelector('h3');
      if (inner) return inner.textContent.trim();
      prev = prev.previousElementSibling;
    }
    // Move up one level
    node = node.parentElement;
    // Stop at body
    if (!node || node.tagName === 'BODY') break;
  }
  return '';
}

function getRows(table) {
  return Array.from(table.querySelectorAll('tbody tr'));
}

function getCells(row) {
  return Array.from(row.querySelectorAll('td')).map(td => td.textContent.trim());
}

function n(v) { return v === '' || v === undefined ? null : parseFloat(v); }

// --- Standings ---
function parseStandings(table) {
  const rows = getRows(table);
  const data = [];
  let currentDiv = '';
  let rank = 0;
  rows.forEach(row => {
    const cells = getCells(row);
    if (cells.length === 1) {
      // Division header row like "Division: B1"
      currentDiv = cells[0].replace('Division:', '').trim();
      rank = 0;
    } else if (cells.length >= 4) {
      rank++;
      const wins = n(cells[2]);
      const losses = n(cells[3]);
      data.push({
        rank,
        division: currentDiv,
        team: cells[0],
        weeks: n(cells[1]),
        wins,
        losses,
        winPct: wins != null && losses != null ? wins / (wins + losses) : null,
      });
    }
  });
  return data;
}

// --- Match results ---
function parseMatchResults(table) {
  return getRows(table).map(row => {
    const c = getCells(row);
    return { team: c[0], against: c[1], date: c[2], week: n(c[3]), games: n(c[4]), wins: n(c[5]), losses: n(c[6]), forfeits: n(c[7]) };
  }).filter(r => r.team);
}

// --- Most improved X01 ---
function parseImprovedX01(table) {
  return getRows(table).map(row => {
    const c = getCells(row);
    return { player: c[0], team: c[1], prevPPD: n(c[2]), ppd: n(c[3]), improvement: n(c[4]) };
  }).filter(r => r.player);
}

// --- Most improved Cricket ---
function parseImprovedCricket(table) {
  return getRows(table).map(row => {
    const c = getCells(row);
    return { player: c[0], team: c[1], prevMPR: n(c[2]), mpr: n(c[3]), improvement: n(c[4]) };
  }).filter(r => r.player);
}

// --- X01 player stats ---
function parseX01Stats(table) {
  return getRows(table).map(row => {
    const c = getCells(row);
    const wins = n(c[5]);
    const games = n(c[4]);
    return {
      player: c[0], team: c[1], div: c[2],
      ppd: n(c[3]), games, wins,
      winPct: games ? wins / games : null,
      hats: n(c[6]), ton80: n(c[7]), hiTon: n(c[8]), loTon: n(c[9]), hiOut: n(c[10]),
    };
  }).filter(r => r.player);
}

// --- Cricket player stats ---
function parseCricketStats(table) {
  return getRows(table).map(row => {
    const c = getCells(row);
    const wins = n(c[5]);
    const games = n(c[4]);
    return {
      player: c[0], team: c[1], div: c[2],
      mpr: n(c[3]), games, wins,
      winPct: games ? wins / games : null,
      assists: n(c[6]), hats: n(c[7]), whorse: n(c[8]),
      mr6: n(c[9]), mr7: n(c[10]), mr8: n(c[11]), mr9: n(c[12]),
    };
  }).filter(r => r.player);
}

// ============================================================
// COLUMN DEFS (built dynamically based on section type)
// ============================================================
function getColumns(section) {
  if (section.columns) return section.columns;

  const key = Object.keys(SECTIONS).find(k => SECTIONS[k] === section);

  if (key === 'standings') {
    const playoffCutoff = section.data.length >= 8 ? 6 : 4;
    const maxW = Math.max(...section.data.map(r => r.wins || 0));
    return [
      { field: 'rank', headerName: '#', width: 52, cellRenderer: p => `<span class="rank-cell ${p.value <= playoffCutoff ? 'top' : ''}">${p.value}</span>` },
      { field: 'division', headerName: 'Div', width: 70, cellRenderer: p => `<span class="div-badge">${p.value}</span>` },
      { field: 'team', headerName: 'Team', flex: 2, minWidth: 120 },
      { field: 'weeks', headerName: 'Wks', width: 70 },
      { field: 'wins', headerName: 'W', flex: 1, cellRenderer: p => {
        const pct = maxW ? (p.value/maxW)*100 : 0;
        return `<div class="bar-cell"><span style="min-width:30px">${p.value}</span><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:var(--accent)"></div></div></div>`;
      }},
      { field: 'losses', headerName: 'L', width: 65 },
      { field: 'winPct', headerName: 'W%', width: 80, valueFormatter: p => p.value != null ? (p.value*100).toFixed(1)+'%' : '' },
    ];
  }

  if (key === 'last_matches') {
    return [
      { field: 'team', headerName: 'Team', flex: 1.5, minWidth: 120 },
      { field: 'against', headerName: 'Against', flex: 1.5, minWidth: 120 },
      { field: 'date', headerName: 'Date', width: 160 },
      { field: 'week', headerName: 'Wk', width: 60 },
      { field: 'games', headerName: 'Gms', width: 65 },
      { field: 'wins', headerName: 'W', width: 60, cellRenderer: p => `<span style="color:var(--green);font-weight:600">${p.value}</span>` },
      { field: 'losses', headerName: 'L', width: 60, cellRenderer: p => `<span style="color:var(--red)">${p.value}</span>` },
      { field: 'forfeits', headerName: 'Forf', width: 65 },
    ];
  }

  if (key && key.endsWith('_x01_improved')) {
    return [
      { field: 'player', headerName: 'Player', flex: 1.5, minWidth: 120 },
      { field: 'team', headerName: 'Team', flex: 1.5, minWidth: 120 },
      { field: 'prevPPD', headerName: 'Prev PPD', width: 110, valueFormatter: p => p.value?.toFixed(2) },
      { field: 'ppd', headerName: 'PPD', width: 90, cellRenderer: p => `<span class="ppd-cell">${p.value?.toFixed(2)}</span>` },
      { field: 'improvement', headerName: '▲ PPD', width: 110, sort: 'desc', cellRenderer: p => `<span class="improvement-cell">+${p.value?.toFixed(2)}</span>` },
    ];
  }

  if (key && key.endsWith('_cricket_improved')) {
    return [
      { field: 'player', headerName: 'Player', flex: 1.5, minWidth: 120 },
      { field: 'team', headerName: 'Team', flex: 1.5, minWidth: 120 },
      { field: 'prevMPR', headerName: 'Prev MPR', width: 110, valueFormatter: p => p.value?.toFixed(2) },
      { field: 'mpr', headerName: 'MPR', width: 90, cellRenderer: p => `<span class="mpr-cell">${p.value?.toFixed(2)}</span>` },
      { field: 'improvement', headerName: '▲ MPR', width: 110, sort: 'desc', cellRenderer: p => `<span class="improvement-cell">+${p.value?.toFixed(2)}</span>` },
    ];
  }

  if (key && key.endsWith('_x01_stats')) {
    const maxPPD = Math.max(...section.data.map(r => r.ppd || 0), 1);
    // Trophy: only on individual division views (not the combined all-divisions view)
    const isDivisionView = !!section.division;
    const maxHiOut = isDivisionView
      ? Math.max(...section.data.map(r => r.hiOut || 0), 0)
      : -1; // -1 means no trophy awarded in combined view
    return [
      { field: 'player', headerName: 'Player', flex: 1.5, minWidth: 120, cellRenderer: p => {
        const d = p.data;
        const isTrophy = isDivisionView && d.hiOut != null && d.hiOut > 0 && d.hiOut === maxHiOut;
        const trophy = isTrophy
          ? `<span class="trophy-icon" title="Highest Out">🏆</span>`
          : '';
        const arrow = d.mostImproved
          ? `<span style="color:var(--green);font-size:11px">▲</span>`
          : '';
        if (!arrow && !trophy) return p.value;
        return `<span style="display:flex;align-items:center;gap:6px;height:40px">${arrow}<span>${p.value}</span>${trophy}</span>`;
      }},
      { field: 'team', headerName: 'Team', flex: 1.2, minWidth: 110 },
      { field: 'ppd', headerName: 'PPD', width: 130, sort: 'desc', cellRenderer: p => {
        const pct = (p.value/maxPPD)*100;
        return `<div class="bar-cell"><span class="ppd-cell" style="min-width:40px">${p.value?.toFixed(2)}</span><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:var(--accent)"></div></div></div>`;
      }},
      { field: 'games', headerName: 'Gms', width: 65 },
      { field: 'wins', headerName: 'W', width: 60 },
      { field: 'winPct', headerName: 'W%', width: 75, valueFormatter: p => p.value != null ? (p.value*100).toFixed(0)+'%' : '' },
      { field: 'hats', headerName: 'Hats', width: 65 },
      { field: 'ton80', headerName: '180s', width: 65 },
      { field: 'hiTon', headerName: 'HiTon', width: 70 },
      { field: 'loTon', headerName: 'LoTon', width: 70 },
      { field: 'hiOut', headerName: 'HiOut', width: 75 },
    ];
  }

  if (key && key.endsWith('_cricket_stats')) {
    const maxMPR = Math.max(...section.data.map(r => r.mpr || 0), 1);
    return [
      { field: 'player', headerName: 'Player', flex: 1.5, minWidth: 120 },
      { field: 'team', headerName: 'Team', flex: 1.2, minWidth: 110 },
      { field: 'mpr', headerName: 'MPR', width: 130, sort: 'desc', cellRenderer: p => {
        const pct = (p.value/maxMPR)*100;
        return `<div class="bar-cell"><span class="mpr-cell" style="min-width:36px">${p.value?.toFixed(2)}</span><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:#7ad4e8"></div></div></div>`;
      }},
      { field: 'games', headerName: 'Gms', width: 65 },
      { field: 'wins', headerName: 'W', width: 60 },
      { field: 'winPct', headerName: 'W%', width: 75, valueFormatter: p => p.value != null ? (p.value*100).toFixed(0)+'%' : '' },
      { field: 'assists', headerName: 'Ast', width: 65 },
      { field: 'hats', headerName: 'Hats', width: 65 },
      { field: 'mr6', headerName: '6MR', width: 60 },
      { field: 'mr7', headerName: '7MR', width: 60 },
      { field: 'mr8', headerName: '8MR', width: 60 },
      { field: 'mr9', headerName: '9MR', width: 60 },
    ];
  }

  // Fallback: auto-generate columns from data keys
  if (section.data && section.data.length > 0) {
    return Object.keys(section.data[0]).map(k => ({ field: k, headerName: k, flex: 1 }));
  }

  return [];
}

// ============================================================
// BUILD SIDEBAR from parsed sections
// ============================================================
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';

  // Overview — non-collapsible
  const overviewLabel = document.createElement('div');
  overviewLabel.className = 'sidebar-section-label';
  overviewLabel.textContent = 'Overview';
  sidebar.appendChild(overviewLabel);
  ['all_x01_stats', 'all_cricket_stats', 'last_matches'].forEach(key => {
    if (SECTIONS[key]) addSidebarBtn(sidebar, key, SECTIONS[key]);
  });

  // Per-division collapsible groups
  const divSections = {};
  Object.keys(SECTIONS).forEach(key => {
    const s = SECTIONS[key];
    if (!s.division) return;
    if (!divSections[s.division]) divSections[s.division] = [];
    divSections[s.division].push(key);
  });

  // Order within each division: standings → x01 → cricket
  const typeOrder = ['_standings', '_x01_stats', '_cricket_stats'];
  Object.keys(divSections).forEach(div => {
    divSections[div].sort((a, b) => {
      const ai = typeOrder.findIndex(t => a.endsWith(t));
      const bi = typeOrder.findIndex(t => b.endsWith(t));
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });
  });

  const divOrder = Object.keys(divSections).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const firstADiv = divOrder.find(d => d.startsWith('A')) ?? divOrder[0];

  divOrder.forEach(div => {
    addCollapsibleGroup(sidebar, div, divSections[div], div === firstADiv);
  });
}

function addCollapsibleGroup(sidebar, div, keys, defaultOpen) {
  const header = document.createElement('div');
  header.className = 'sidebar-group-header' + (defaultOpen ? ' open' : '');
  header.innerHTML = `<span class="sidebar-group-header-label">Division ${div}</span><span class="sidebar-group-chevron">▶</span>`;
  const items = document.createElement('div');
  items.className = 'sidebar-group-items' + (defaultOpen ? ' open' : '');
  keys.forEach(key => { if (SECTIONS[key]) addSidebarBtn(items, key, SECTIONS[key]); });
  header.addEventListener('click', () => {
    const isOpen = items.classList.toggle('open');
    header.classList.toggle('open', isOpen);
  });
  sidebar.appendChild(header);
  sidebar.appendChild(items);
}

function addSidebarBtn(container, key, section) {
  const btn = document.createElement('button');
  btn.className = 'sidebar-btn';
  btn.dataset.key = key;
  btn.innerHTML = `<span class="sidebar-btn-icon">${section.icon || '📊'}</span><span class="sidebar-btn-text">${section.label}<span class="sidebar-btn-sub">${section.sub || ''}</span></span>`;
  btn.addEventListener('click', () => loadSection(key));
  container.appendChild(btn);
}

// ============================================================
// LOAD SECTION INTO GRID
// ============================================================
function loadSection(key) {
  const section = SECTIONS[key];
  if (!section) return;

  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));

  // Auto-expand the collapsible group containing this button
  const activeBtn = document.querySelector(`.sidebar-btn[data-key="${key}"]`);
  if (activeBtn) {
    const items = activeBtn.closest('.sidebar-group-items');
    if (items && !items.classList.contains('open')) {
      items.classList.add('open');
      const hdr = items.previousElementSibling;
      if (hdr) hdr.classList.add('open');
    }
  }

  const divLabel = section.division ? ` · Div ${section.division}` : '';
  document.getElementById('mainTitle').textContent = section.label + divLabel;
  document.getElementById('mainSubtitle').textContent =
    (section.sub || '') + (section.division && (key.endsWith('_x01_stats') || key.endsWith('_cricket_stats'))
      ? '  —  click any row to view season progression' : '');

  const cols = getColumns(section);
  gridApi.setGridOption('columnDefs', cols);
  gridApi.setGridOption('rowData', section.data || []);
  gridApi.setGridOption('quickFilterText', '');
  document.getElementById('searchInput').value = '';
  updateRowCount();
  // Close mobile sidebar drawer when a section is tapped
  window.dispatchEvent(new Event('sectionLoaded'));
}

function updateRowCount() {
  if (!gridApi) return;
  let c = 0;
  gridApi.forEachNodeAfterFilter(() => c++);
  document.getElementById('rowCount').textContent = c;
}

document.getElementById('searchInput').addEventListener('input', e => {
  if (gridApi) gridApi.setGridOption('quickFilterText', e.target.value);
});

function setOverlay(msg) {
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('overlayMsg').textContent = msg;
  document.getElementById('overlayMsg').className = 'overlay-sub';
}

function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

function showError(msg) {
  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="overlay-icon">⚠️</div>
    <div class="overlay-title">Load Failed</div>
    <div class="overlay-error">${msg}</div>

  `;
  document.getElementById('loadStatus').textContent = '✗ Failed to load';
  document.getElementById('loadStatus').style.color = 'var(--red)';
